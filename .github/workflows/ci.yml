name: CI

# Gates that run on every push and pull request. Phase 1 defines them; later phases add the security,
# licence-audit and printing-matrix jobs described in docs/architecture/07-build-installer-ci-release.md.
#
# The Windows job is the only place the real .exe and installer are produced: the development sandbox has
# no Windows and its Python has no shared library for PyInstaller, so nothing here is faked — packaging
# evidence always comes from a Windows runner.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # temporary: the CI failure-diagnostics step posts to the pull request

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Lint, format, types and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install gate tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check . --output-format=github
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Secret scan (activation code, tokens, keys)
        run: python tools/secret_scan.py

  tests-linux:
    name: Test suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Qt runtime libraries
        # The offscreen Qt platform still links against these on a bare runner. The development sandbox
        # uses tools/devsandbox/ instead because it has no apt access.
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" 2>&1 | tee -a pytest-output.log
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q -p no:randomly 2>&1 | tee -a pytest-output.log
      - name: Publish failure diagnostics to the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ${{ github.job }} — captured output"
            echo '```text'
            tail -c 8000 pytest-output.log 2>/dev/null || echo "no output captured"
            echo '```'
          } > diagnostics.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostics.md
      - name: Upload rendered screens (review artefacts, Linux baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders-linux
          path: tests/ui/artifacts/screens
          if-no-files-found: ignore
          retention-days: 14

  windows-build:
    name: Windows bundle, installer and smoke test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify Windows version resource is up to date
        run: python packaging/make_version_info.py --check
      - name: Run test suite on Windows
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -p no:randomly 2>&1 | tee -a pytest-output.log
      - name: Build the application bundle (PyInstaller onedir)
        run: pyinstaller --noconfirm --clean packaging/dentivapro.spec
      - name: Audit the bundle and launch it offscreen
        run: python packaging/check_bundle.py dist/DentivaPro
      - name: Build the installer (NSIS)
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { $nsis = "makensis" }
          $version = python -c "import sys; sys.path.insert(0, 'src'); from dentivapro.version import __version__; print(__version__)"
          & $nsis "/DPRODUCT_VERSION=$version" "/DSOURCE_DIR=dist\DentivaPro" "/DOUT_DIR=dist" packaging/installer.nsi
      - name: Installer smoke test (silent install, launch, uninstall)
        run: |
          $installer = Get-ChildItem dist\DentivaPro-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "installer was not produced" }
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $installed = Join-Path $env:LOCALAPPDATA "Programs\DentivaPro\DentivaPro.exe"
          if (-not (Test-Path $installed)) { throw "silent install did not place the application" }
          $env:DENTIVAPRO_DATA_ROOT = Join-Path $env:RUNNER_TEMP "dentivapro-smoke-data"
          $output = & $installed --check 2>&1 | Out-String
          Write-Host $output
          foreach ($expected in @("schema version", "integrity check ok", "foreign keys on", "bundled fonts ok")) {
            if ($output -notmatch [regex]::Escape($expected)) { throw "installed application did not report '$expected'" }
          }
          Start-Process -FilePath (Join-Path $env:LOCALAPPDATA "Programs\DentivaPro\Uninstall.exe") -ArgumentList "/S" -Wait
          if (Test-Path (Join-Path $env:LOCALAPPDATA "Programs\DentivaPro\DentivaPro.exe")) {
            throw "uninstall did not remove the application"
          }
      - name: Publish failure diagnostics to the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ${{ github.job }} — captured output"
            echo '```text'
            tail -c 8000 pytest-output.log 2>/dev/null || echo "no output captured"
            echo '```'
          } > diagnostics.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostics.md

      - name: Upload Windows render artefacts (for the authoritative golden baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders-windows
          path: tests/ui/artifacts/screens
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload bundle, installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: dentivapro-windows
          path: |
            dist/DentivaPro
            dist/DentivaPro-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
