name: CI

# Gates that run on every push and pull request. Phase 1 defines them; later phases add the security,
# licence-audit and printing-matrix jobs described in docs/architecture/07-build-installer-ci-release.md.
#
# The Windows job is the only place the real .exe and installer are produced: the development sandbox has
# no Windows and its Python has no shared library for PyInstaller, so nothing here is faked — packaging
# evidence always comes from a Windows runner.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Lint, format, types and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install gate tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check . --output-format=github
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Secret scan (activation code, tokens, keys)
        run: python tools/secret_scan.py

  tests-linux:
    name: Test suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Qt runtime libraries
        # The offscreen Qt platform still links against these on a bare runner. The development sandbox
        # uses tools/devsandbox/ instead because it has no apt access.
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -p no:randomly
      - name: Upload rendered screens (review artefacts, Linux baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders-linux
          path: tests/ui/artifacts/screens
          if-no-files-found: ignore
          retention-days: 14

  windows-build:
    name: Windows bundle, installer and smoke test
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write   # temporary: failure diagnostics are posted to the pull request
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" 2>&1 | tee -a ci-output.log
      - name: Verify Windows version resource is up to date
        run: |
          set -o pipefail
          python packaging/make_version_info.py --check 2>&1 | tee -a ci-output.log
      - name: Run test suite on Windows
        run: |
          set -o pipefail
          python -m pytest -q -p no:randomly 2>&1 | tee -a ci-output.log
      - name: Build the application bundle (PyInstaller onedir)
        run: |
          set -o pipefail
          pyinstaller --noconfirm --clean packaging/dentivapro.spec 2>&1 | tee -a ci-output.log
      - name: Audit the bundle and launch it offscreen
        run: |
          set -o pipefail
          python packaging/check_bundle.py dist/DentivaPro 2>&1 | tee -a ci-output.log
      - name: Install NSIS
        run: |
          set -o pipefail
          {
            if command -v makensis >/dev/null 2>&1; then
              echo "NSIS already available"
            else
              choco install nsis --no-progress -y
            fi
          } 2>&1 | tee -a ci-output.log
      - name: Build the installer (NSIS)
        run: |
          set -o pipefail
          nsis="$(command -v makensis || true)"
          if [ -z "$nsis" ] && [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            nsis="/c/Program Files (x86)/NSIS/makensis.exe"
          fi
          [ -n "$nsis" ] || { echo "makensis not found after installing NSIS"; exit 1; }
          echo "using $nsis"
          # Git Bash on Windows rewrites /D... arguments into file paths; disable that.
          export MSYS2_ARG_CONV_EXCL='*'
          export MSYS_NO_PATHCONV=1
          version=$(python -c "import sys; sys.path.insert(0, 'src'); from dentivapro.version import __version__; print(__version__)")
          "$nsis" "/DPRODUCT_VERSION=$version" "/DSOURCE_DIR=dist\\DentivaPro" "/DOUT_DIR=dist" packaging/installer.nsi 2>&1 | tee -a ci-output.log
      - name: Installer smoke test (silent install, launch, uninstall)
        run: |
          set -o pipefail
          {
            installer=$(ls dist/DentivaPro-Setup-*.exe | head -1)
            [ -n "$installer" ] || { echo "installer was not produced"; exit 1; }
            "$installer" /S
            installed="$LOCALAPPDATA/Programs/DentivaPro/DentivaPro.exe"
            [ -f "$installed" ] || { echo "silent install did not place the application"; exit 1; }
            export DENTIVAPRO_DATA_ROOT="$RUNNER_TEMP/dentivapro-smoke-data"
            output=$("$installed" --check 2>&1)
            echo "$output"
            # The self-check prints padded "key : value" lines, so match on patterns.
            for pattern in "schema version[[:space:]]*: [0-9]" "integrity check[[:space:]]*: ok" "foreign keys[[:space:]]*: on" "bundled fonts[[:space:]]*: ok"; do
              if ! printf '%s\n' "$output" | grep -Eq "$pattern"; then
                echo "installed application did not report pattern '$pattern'"
                printf '%s\n' "$output"
                exit 1
              fi
            done
            "$LOCALAPPDATA/Programs/DentivaPro/Uninstall.exe" /S
            sleep 5
            [ ! -f "$installed" ] || { echo "uninstall did not remove the application"; exit 1; }
          } 2>&1 | tee -a ci-output.log
      - name: Publish failure diagnostics to the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### ${{ github.job }} — captured output"
            echo '```text'
            tail -c 8000 ci-output.log 2>/dev/null || echo "no output captured"
            echo '```'
          } > diagnostics.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostics.md
      - name: Upload Windows render artefacts (for the authoritative golden baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders-windows
          path: tests/ui/artifacts/screens
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload bundle, installer and checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dentivapro-windows
          path: |
            dist/DentivaPro
            dist/DentivaPro-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
